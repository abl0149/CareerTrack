<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CareerTrack</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="index.html">
      CareerTrack
    </a>

    <span class="navbar-text text-light">
      Job & Internship Tracker
    </span>
  </nav>

  <main class="container py-5">

    <section class="mb-5">
      <h1 class="fw-bold">CareerTrack Dashboard</h1>

      <p class="text-muted">
        Track your job and internship applications in one place.
      </p>
    </section>

    <section class="row g-4 mb-5">

      <div class="col-md-3">
        <div class="card shadow-sm p-3">
          <h6 class="text-muted">Total Applications</h6>
          <h2 id="totalApplications">0</h2>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card shadow-sm p-3">
          <h6 class="text-muted">Applied</h6>
          <h2 id="appliedCount">0</h2>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card shadow-sm p-3">
          <h6 class="text-muted">Interviews</h6>
          <h2 id="interviewCount">0</h2>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card shadow-sm p-3">
          <h6 class="text-muted">Offers</h6>
          <h2 id="offerCount">0</h2>
        </div>
      </div>

    </section>

    <section class="d-flex gap-3 mb-4">

      <a
        href="add-application.html"
        class="btn btn-primary"
      >
        Add Application
      </a>

      <a
        href="applications.html"
        class="btn btn-outline-dark"
      >
        View Applications
      </a>

    </section>

    <section>
      <h3 class="mb-3">Recent Applications</h3>

      <div class="card shadow-sm">
        <div class="card-body" id="recentApplications">

          <p class="text-muted mb-0">
            No applications yet. Add your first application to get started.
          </p>

        </div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
