<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Application | CareerTrack</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="index.html">CareerTrack</a>
    <span class="navbar-text text-light">
      Add Application
    </span>
  </nav>

  <main class="container py-5">
    <div class="mb-4">
      <h1 class="fw-bold">Add Application</h1>
      <p class="text-muted">
        Enter the details for a job or internship application.
      </p>
    </div>

    <div class="card shadow-sm p-4">
      <form id="applicationForm">

        <div class="mb-3">
          <label for="company" class="form-label">Company</label>
          <input
            type="text"
            class="form-control"
            id="company"
            required
          >
        </div>

        <div class="mb-3">
          <label for="role" class="form-label">Role</label>
          <input
            type="text"
            class="form-control"
            id="role"
            required
          >
        </div>

        <div class="mb-3">
          <label for="status" class="form-label">Status</label>
          <select id="status" class="form-select" required>
            <option value="">Select status</option>
            <option value="Applied">Applied</option>
            <option value="Interview">Interview</option>
            <option value="Offer">Offer</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="date" class="form-label">Application Date</label>
          <input
            type="date"
            class="form-control"
            id="date"
            required
          >
        </div>

        <div class="mb-3">
          <label for="deadline" class="form-label">Deadline</label>
          <input
            type="date"
            class="form-control"
            id="deadline"
          >
        </div>

        <div class="mb-3">
          <label for="notes" class="form-label">Notes</label>
          <textarea
            id="notes"
            class="form-control"
            rows="4"
          ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
          Save Application
        </button>

        <a href="index.html" class="btn btn-outline-secondary ms-2">
          Cancel
        </a>

      </form>
    </div>
  </main>

  <script src="add-application.js"></script>
</body>
</html>
